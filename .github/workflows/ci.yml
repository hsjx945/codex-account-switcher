name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - codex/windows-support

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2022
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up .NET 8
        uses: actions/setup-dotnet@d4c94342e560b34958eacfc5d055d21461ed1c5d # v4
        with:
          dotnet-version: 8.0.x
      - name: Run Windows core tests
        run: dotnet run --project windows/tests/CodexAccountSwitcher.Tests.csproj --configuration Release
      - name: Build Windows installer
        shell: pwsh
        run: ./scripts/package-windows.ps1 -SkipTests
      - name: Install and uninstall test build
        shell: pwsh
        run: ./scripts/test-windows-installer.ps1
      - name: Upload Windows test build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: codex-account-switcher-windows-test
          path: |
            windows/artifacts/Codex-Account-Switcher-Setup-win-x64.exe
            windows/artifacts/Codex-Account-Switcher-Setup-win-x64.exe.sha256
          if-no-files-found: error

  test:
    runs-on: macos-26

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Show selected Swift toolchain
        run: |
          xcode-select -p
          xcrun --find swift
          swift --version

      - name: Check changed lines for whitespace errors
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          if [[ "$BASE_SHA" == "0000000000000000000000000000000000000000" ]]; then
            empty_tree=$(git hash-object -t tree /dev/null)
            git diff --check "$empty_tree" "$HEAD_SHA"
          else
            git diff --check "$BASE_SHA...$HEAD_SHA"
          fi

      - name: Check release version
        run: ./scripts/check-version.sh

      - name: Check website discovery metadata
        run: node scripts/check-site-geo.mjs

      - name: Run Swift tests
        run: ./scripts/run-swift-tests.sh

      - name: Run core checks
        run: ./scripts/run-core-checks.sh

      - name: Render native UI fixtures
        run: ./scripts/run-ui-checks.sh
